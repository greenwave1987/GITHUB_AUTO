name: GLaDOS Auto Exchange

on:
  workflow_dispatch: # 支持手动触发
  #schedule:
    # 每天北京时间 11:30 运行一次 (UTC 3:30)
    # 建议在签到任务（11:00）运行之后执行
    #- cron: "30 3 * * *"

jobs:
  exchange:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests pynacl
          python -m playwright install chromium

      - name: Run GLaDOS auto exchange
        env:
          # 引用你已有的 Secrets 和 Vars
          GLADOS_EMAIL: ${{ vars.GLADOS_EMAIL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GLADOS_LOCAL: ${{ secrets.GLADOS_LOCAL }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # 确保路径指向你保存兑换脚本的位置
          python -u glados/glados_exchange.py
