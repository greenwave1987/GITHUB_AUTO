name: GLaDOS Auto Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
permissions:
      contents: write
      actions: write
jobs:
  GLaDOS:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -u -m pip install --upgrade pip
          python -u -m pip install playwright requests pynacl matplotlib
          python -u -m playwright install chromium

      - name: Run GLaDOS auto login & checkin
        env:
          GLADOS_EMAIL: ${{ vars.GLADOS_EMAIL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GLADOS_LOCAL: ${{ secrets.GLADOS_LOCAL }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u glados/glados_check.py
      - name: 🧹 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
