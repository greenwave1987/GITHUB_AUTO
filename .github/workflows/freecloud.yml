name: FreeCloud_Auto_Run

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        # 这一步修复 Segmentation fault，安装运行 Chromium 所需的 Linux 核心库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libxkbcommon0 libasound2 libpangocairo-1.0-0 libx11-xcb1 libcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6 libcups2 libxss1 libxrandr2

      - name: Install Python Packages
        # 修复 ImportError: 使用 [geoip] 模式安装
        run: |
          pip install requests pyyaml
          pip install "cloakbrowser[geoip]"
          # 如果 cloakbrowser 底层是 playwright，执行以下命令：
          # playwright install chromium

      - name: Run Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        # 使用 xvfb-run 运行脚本可以提供虚拟显示环境，进一步防止段错误
        run: xvfb-run --auto-servernum python freecloud/renew.py
