name: GLaDOS Auto Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 03:00（你可自己改）

jobs:
  glados:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -u -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -u -m pip install -r requirements.txt
          else
            python -u -m pip install playwright requests
          fi

      - name: Install Playwright Chromium
        run: |
          python -u -m playwright install chromium

      - name: Run GLaDOS auto login & checkin
        env:
          GLADOS_EMAIL: ${{ secrets.GLADOS_EMAIL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GLADOS_LOCAL: ${{ secrets.GLADOS_LOCAL }}
        run: |
          python -u glados/glados_check.py
