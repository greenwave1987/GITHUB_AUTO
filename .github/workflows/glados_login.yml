name: GLaDOS Auto Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 每天 UTC 00:30（日本时间 09:30）

jobs:
  glados:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📥 Install dependencies
        run: |
          python -u -m pip install --upgrade pip
          python -u -m pip install -r requirements.txt
          python -u -m playwright install chromium

      - name: 🚀 Run GLaDOS checkin (unbuffered)
        env:
          GLADOS_EMAIL: ${{ secrets.GLADOS_EMAIL }}
          GLADOS_PASSWORD: ${{ secrets.GLADOS_PASSWORD }}
        run: |
          python -u glados/glados_check.py

      - name: 📸 Upload debug artifacts (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glados-debug
          path: |
            *.png
            *.html
