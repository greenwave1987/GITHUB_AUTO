name: GLaDOS Auto Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # UTC 00:30（日本 09:30）

jobs:
  glados:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📥 Install Python deps (no requirements.txt)
        run: |
          set -x
          python -u -m pip install --upgrade pip
          python -u -m pip install playwright requests
          python -u -m playwright install chromium
          python -u -m playwright install-deps

      - name: 🚀 Run GLaDOS script (unbuffered)
        env:
          GLADOS_EMAIL: ${{ secrets.GLADOS_EMAIL }}
          GLADOS_PASSWORD: ${{ secrets.GLADOS_PASSWORD }}
        run: |
          python -u glados/glados_check.py

      - name: 📸 Upload debug artifacts (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glados-debug
          path: |
            *.png
            *.html
