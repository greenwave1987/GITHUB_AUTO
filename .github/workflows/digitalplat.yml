name: Domain Auto Renew

on:
  schedule:
    # 每 10 天的凌晨 2 点运行 (UTC 时间)
    - cron: '0 2 */10 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # 升级到 3.11，对预编译的 wheel 兼容更好，安装速度更快

      - name: Install dependencies
        # 将原先的 requests 改为安装 curl-cffi
        run: |
          pip install --upgrade pip
          pip install curl-cffi

      - name: Run renewal script
        env:
          DOMAIN_COOKIE: ${{ secrets.DOMAIN_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python digitalplat/renew.py
